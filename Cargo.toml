[package]
name = "koshelf"
version = "2026.8.0"
description = "KoShelf — a reading companion powered by KOReader metadata."
repository = "https://github.com/paviro/KOShelf"
license = "EUPL-1.2"
authors = ["Paul-Vincent Roll"]
edition = "2024"
build = "build/main.rs"

[dependencies]
# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }
# Error handling
anyhow = "1.0.104"
# Async
tokio = { version = "1.53.3", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
    "sync",
] }
# File system
walkdir = "2.5.0"
# File system watching
notify = "8.2.0"
# Temporary directories
tempfile = "3.27.0"
# EPUB and .fb2.zip parsing
zip = "9.0.3"
# Image processing
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
] }
webp = "0.3.1"
# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
# Date/time
chrono = { version = "0.4.45", features = ["serde", "std", "unstable-locales"] }
# Logging
log = "0.4.34"
env_logger = "0.11.11"
# Progress bars
indicatif = "0.18.6"
# XML parsing
quick-xml = "0.42.0"
# HTML sanitization
ammonia = "4.2.3"
# Web server (for live server mode)
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = [
    "fs",
    "set-header",
    "compression-gzip",
    "compression-br",
] }
# Futures utilities
futures = "0.3.34"
# SQLite database access
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "json"] }
chrono-tz = "0.10.4"
md5 = "0.8.1"
regex = "1.13.1"
resvg = "0.48.1"
base64 = "0.23.1"
include_dir = "0.7.4"
argon2 = "0.6.0"
rand = "0.10.3"
rusty_paseto = "0.10.1"
rpassword = "7.5.4"
governor = "0.10.4"
dashmap = "6.2.1"
uuid = { version = "1.28.0", features = ["v4", "v7"] }
ipnet = "2.12.2"
# Gzip decompression for embedded license data
flate2 = "1.1.10"
# Memory allocator
mimalloc = "0.1.52"

[target.'cfg(not(windows))'.dependencies]
# CBR/RAR archive extraction (not supported on Windows)
unrar = "0.5.8"

# Lua parsing (use LuaJIT to match KoReader's runtime). Mainline LuaJIT has no
# riscv64 backend, so that arch uses vendored PUC Lua 5.1 instead — KOReader
# sidecars are plain Lua 5.1 data chunks, so the semantics are identical.
[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
mlua = { version = "0.12.2", features = ["luajit", "vendored", "send"] }

[target.'cfg(target_arch = "riscv64")'.dependencies]
mlua = { version = "0.12.2", features = ["lua51", "vendored", "send"] }

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
flate2 = "1.1.10"

[dev-dependencies]
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
