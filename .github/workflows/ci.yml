name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  KOSHELF_SKIP_NPM_INSTALL: "1"
  KOSHELF_SKIP_REACT_BUILD: "1"
  KOSHELF_SKIP_LICENSE_GENERATION: "1"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            head="$GITHUB_SHA"
          fi

          message_file="$(mktemp)"
          trap 'rm -f "$message_file"' EXIT
          while read -r commit; do
            git show --no-patch --format=%B "$commit" > "$message_file"
            if ! .githooks/commit-msg "$message_file"; then
              echo "Invalid subject in commit $commit:" >&2
              git show --no-patch --format='%s' "$commit" >&2
              exit 1
            fi
          done < <(git rev-list --reverse "$base..$head")

  format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          components: rustfmt
      - run: cargo fmt --all --check

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --deny warnings

  frontend:
    name: Frontend bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - if: ${{ !cancelled() }}
        run: npm --prefix frontend run format:check
      - if: ${{ !cancelled() }}
        run: npm --prefix frontend run build
      - name: Collect portable frontend build inputs
        run: bash .github/scripts/collect-frontend-build-assets.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: |
            frontend/dist
            frontend/build-assets
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux (lint · test · docs)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: frontend
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --no-deps --locked

  macos:
    name: macOS (check)
    needs: frontend
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: frontend
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --all-targets --locked

  windows:
    name: Windows (check, ${{ matrix.runner }})
    needs: frontend
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        runner: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: frontend
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --all-targets --locked

  cross-check:
    name: Cross-check (${{ matrix.target }})
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
          # GCC 13 ICEs while expanding debug locations in unrar's SSE
          # translation unit. Rust debug info remains enabled.
          - target: i686-unknown-linux-gnu
            host_multilib: true
            cxxflags: -g0
          - target: i686-unknown-linux-musl
            host_multilib: true
            cxxflags: -g0
          - target: armv7-unknown-linux-gnueabihf
            host_multilib: true
          - target: armv7-unknown-linux-musleabihf
            host_multilib: true
          # Mainline LuaJIT has no riscv64 backend; this row exercises the
          # vendored PUC Lua 5.1 fallback (see Cargo.toml).
          - target: riscv64gc-unknown-linux-gnu
          - target: x86_64-unknown-freebsd
            freebsd_sysroot: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: frontend
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: Install 32-bit host compiler
        if: ${{ matrix.host_multilib }}
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib linux-libc-dev:i386
      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        if: ${{ !matrix.freebsd_sysroot }}
        with:
          target: ${{ matrix.target }}
      - if: ${{ matrix.freebsd_sysroot }}
        run: sudo apt-get update && sudo apt-get install --yes clang
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: ${{ matrix.freebsd_sysroot }}
        id: freebsd-sysroot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/freebsd-sysroot
          key: freebsd-sysroot-14.5-RELEASE-v4
      - if: ${{ matrix.freebsd_sysroot && steps.freebsd-sysroot.outputs.cache-hit != 'true' }}
        name: Download FreeBSD sysroot
        run: |
          curl --fail --location --output /tmp/base.txz \
            https://download.freebsd.org/releases/amd64/amd64/14.5-RELEASE/base.txz
          echo "d16b68fe0e9e136ce67ab1084042c848bbffecd1eb295f206bd1c6785deb45a4  /tmp/base.txz" | sha256sum --check
          mkdir -p "$HOME/freebsd-sysroot"
          # cargo check still runs mlua's vendored LuaJIT build, which links a
          # target luajit binary; that link needs libgcc.a and libc_nonshared.a,
          # so keep static archives. Only clang's resource dir is dropped.
          tar -C "$HOME/freebsd-sysroot" \
            --exclude './usr/lib/clang' \
            -xf /tmp/base.txz ./lib ./usr/include ./usr/lib
      - if: ${{ matrix.freebsd_sysroot }}
        name: Configure FreeBSD C and C++ compilers
        run: |
          {
            echo "CC_x86_64_unknown_freebsd=clang"
            echo "CXX_x86_64_unknown_freebsd=clang++"
            echo "CFLAGS_x86_64_unknown_freebsd=--sysroot=$HOME/freebsd-sysroot"
            echo "CXXFLAGS_x86_64_unknown_freebsd=--sysroot=$HOME/freebsd-sysroot -stdlib=libc++"
          } >> "$GITHUB_ENV"
      - run: cargo check --target ${{ matrix.target }} --all-targets --locked
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}
